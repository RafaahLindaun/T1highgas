name: HighGAS One Shot Fix

on:
  push:
    branches: [highgas-full-tunnel-v1]
    paths: [".github/workflows/highgas-one-shot-fix.yml"]

permissions:
  contents: write

jobs:
  patch-zsh-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highgas-full-tunnel-v1
      - name: Patch reserved zsh status variable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('local-helper/highgas-tor')
          s = p.read_text()
          old = s
          s = s.replace('local dev="$1" gw="$2" status rules token=""', 'local dev="$1" gw="$2" pfstate rules token=""')
          s = s.replace('  status="$(/sbin/pfctl -s info 2>/dev/null | /usr/bin/awk \'/Status:/{print $2;exit}\')"', '  pfstate="$(/sbin/pfctl -s info 2>/dev/null | /usr/bin/awk \'/Status:/{print $2;exit}\')"')
          s = s.replace('  if [[ "$status" != "Enabled" ]]; then', '  if [[ "$pfstate" != "Enabled" ]]; then')
          if s == old:
              raise SystemExit('expected zsh status patterns were not found')
          if ' status rules token=' in s or '"$status" != "Enabled"' in s:
              raise SystemExit('reserved status variable remains')
          p.write_text(s)
          PY
          git diff --check
          grep -q 'pfstate=' local-helper/highgas-tor
          git config user.name 'HighGAS CI'
          git config user.email '89591381+RafaahLindaun@users.noreply.github.com'
          git add local-helper/highgas-tor
          git commit -m 'HighGAS: corrigir variável reservada status no zsh'
          git push origin HEAD:highgas-full-tunnel-v1
