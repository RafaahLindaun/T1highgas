name: HighGAS Universal Final

on:
  workflow_dispatch:
  push:
    branches: [highgas-windows11-universal-v2]
    paths:
      - 'local-helper/**'
      - 'public/highgas-local-controller.js'
      - '.github/workflows/highgas-universal-final.yml'
  pull_request:
    paths:
      - 'local-helper/**'
      - 'public/highgas-local-controller.js'
      - '.github/workflows/highgas-universal-final.yml'

env:
  TOR_VERSION: '15.0.21'
  TUN2SOCKS_VERSION: '2.7.0'
  TUN2SOCKS_WIN_SHA256: 'c5d46e9452f6c9cc7c15ab9158d6d6a0169ceecd6bca019ce476b49337d2be43'
  TUN2SOCKS_MAC_SHA256: '6e654da8bab9ca1645862f0e251a69980e0966680713011feea7b1e5901b2a95'
  WINTUN_VERSION: '0.14.1'
  CHECK_URL: 'https://lowgas.vercel.app/api/network-info'

jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: local-helper/go.mod
      - name: Compile and audit fail-closed source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          (cd local-helper && go vet ./direct ./windows && go test ./direct ./windows)
          (cd local-helper && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/highgas-helper.exe ./windows)
          (cd local-helper && GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/highgas-helper-mac ./direct)
          file /tmp/highgas-helper.exe | grep -qi 'PE32+'
          file /tmp/highgas-helper-mac | grep -Eqi 'x86_64|x86-64'
          zsh -n local-helper/highgas-tor
          zsh -n local-helper/install.command
          zsh -n local-helper/uninstall.command
          W=local-helper/windows/highgas-tor.ps1
          G=local-helper/windows/main.go
          T=0
          ok(){ T=$((T+1)); echo "SOURCE_PASS $T - $1"; }
          has(){ grep -Fq -- "$2" "$1"; ok "$2"; }
          lacks(){ ! grep -Fq -- "$2" "$1"; ok "sem $2"; }
          has "$G" 'version = "2.0.0"'
          has "$G" 'highgas-full-tunnel'
          has "$G" 'VERIFIED=1'
          has "$G" 'ConstantTimeCompare'
          has "$W" "Set-NetFirewallProfile -Profile Domain,Private,Public -DefaultOutboundAction Block"
          has "$W" "HighGAS Wintun TCP IPv4"
          has "$W" "HighGAS Tor TCP"
          has "$W" "HighGAS DHCP"
          has "$W" "--OutboundBindAddress"
          has "$W" "Pin-TorGuards"
          has "$W" "New-NetRoute -DestinationPrefix '0.0.0.0/0'"
          has "$W" 'IP_CHANGED='
          has "$W" 'COUNTRY_OK='
          has "$W" 'DNS_OK='
          has "$W" 'IPV6_OK='
          has "$W" 'ROUTE_OK='
          has "$W" 'VERIFIED='
          lacks "$W" "'--interface',[string]$Physical.Alias"
          has local-helper/highgas-tor 'VERIFIED=1'
          has local-helper/highgas-tor 'block drop out quick inet6 all'
          has local-helper/highgas-tor 'block drop out quick on $dev inet all'
          has local-helper/highgas-tor 'route-to ($dev $gw)'
          has public/highgas-local-controller.js 'IP alterado'
          has public/highgas-local-controller.js 'País correto'
          has public/highgas-local-controller.js 'DNS protegido'
          has public/highgas-local-controller.js 'IPv6 sem vazamento'
          has public/highgas-local-controller.js 'Kill Switch'
          echo "TOTAL_SOURCE_CHECKS=$T"
          test "$T" -ge 25

  windows-native-20:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Create and destroy Wintun twenty times
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $ProgressPreference='SilentlyContinue'
          foreach($p in @('local-helper/windows/highgas-tor.ps1','local-helper/windows/install.ps1','local-helper/windows/uninstall.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){throw "PowerShell parser failed: $p"}
          }
          $base="$env:RUNNER_TEMP\native20"; New-Item -ItemType Directory -Force $base|Out-Null
          Invoke-WebRequest -UseBasicParsing "https://github.com/xjasonlyu/tun2socks/releases/download/v$env:TUN2SOCKS_VERSION/tun2socks-windows-amd64.zip" -OutFile "$base\t2s.zip"
          if((Get-FileHash "$base\t2s.zip" -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:TUN2SOCKS_WIN_SHA256){throw 'tun2socks SHA256'}
          Expand-Archive "$base\t2s.zip" "$base\t2s" -Force
          $tun=(Get-ChildItem "$base\t2s" -Recurse -File|Where-Object Name -like 'tun2socks*.exe'|Select-Object -First 1).FullName
          Invoke-WebRequest -UseBasicParsing "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile "$base\w.zip"
          Expand-Archive "$base\w.zip" "$base\w" -Force
          $dll=(Get-ChildItem "$base\w" -Recurse -File -Filter wintun.dll|Where-Object FullName -match 'amd64'|Select-Object -First 1).FullName
          if((Get-AuthenticodeSignature $dll).Status-ne'Valid'){throw 'Wintun signature'}
          Copy-Item $dll (Split-Path $tun) -Force
          1..20 | ForEach-Object {
            $i=$_; $name="HighGASCI$i"; $p=$null
            try {
              $p=Start-Process $tun -ArgumentList @('--device',"tun://$name",'--proxy','socks5://127.0.0.1:9','--loglevel','error') -WorkingDirectory (Split-Path $tun) -PassThru -WindowStyle Hidden
              $a=$null
              for($n=0;$n-lt75;$n++){if($p.HasExited){break};$a=Get-NetAdapter -ErrorAction SilentlyContinue|Where-Object Name -eq $name|Select-Object -First 1;if($a){break};Start-Sleep -Milliseconds 200}
              if(!$a-or$p.HasExited){throw "Wintun cycle $i failed"}
              netsh interface ipv4 set address name="$name" source=static addr="192.168.$i.1" mask=255.255.255.0 gateway=none | Out-Null
              if($LASTEXITCODE-ne0){throw "IPv4 cycle $i"}
              Write-Host "WINTUN_PASS $i/20 name=$name ifIndex=$($a.ifIndex)"
            } finally { if($p){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}; Start-Sleep -Milliseconds 250 }
          }
          Write-Host 'WINDOWS_WINTUN_20_OF_20=PASS'

  windows-tor-20:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - exit: de
            country: DE
            port: 39150
          - exit: us
            country: US
            port: 39151
    steps:
      - name: Validate real Tor exit twenty times
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue'
          $base="$env:RUNNER_TEMP\tor20-${{ matrix.country }}";New-Item -ItemType Directory -Force $base|Out-Null
          $url="https://archive.torproject.org/tor-package-archive/torbrowser/$env:TOR_VERSION/tor-expert-bundle-windows-x86_64-$env:TOR_VERSION.tar.gz"
          $sum="https://archive.torproject.org/tor-package-archive/torbrowser/$env:TOR_VERSION/sha256sums-signed-build.txt"
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$base\tor.tgz"
          Invoke-WebRequest -UseBasicParsing $sum -OutFile "$base\sha.txt"
          $name="tor-expert-bundle-windows-x86_64-$env:TOR_VERSION.tar.gz"
          $line=(Select-String -LiteralPath "$base\sha.txt" -SimpleMatch -Pattern $name|Select-Object -First 1).Line
          if(!$line){throw 'Tor hash entry'}
          $expected=($line-split'\s+')[0].ToLowerInvariant();$actual=(Get-FileHash "$base\tor.tgz" -Algorithm SHA256).Hash.ToLowerInvariant();if($actual-ne$expected){throw 'Tor SHA256'}
          tar -xzf "$base\tor.tgz" -C $base
          $tor=Join-Path $base 'tor\tor.exe';$geo=Join-Path $base 'data\geoip';$geo6=Join-Path $base 'data\geoip6';$data=Join-Path $base 'data-run';New-Item -ItemType Directory -Force $data|Out-Null
          $log="$base\tor.log";$err="$base\tor.err"
          $args=@('--SocksPort','127.0.0.1:${{ matrix.port }}','--DataDirectory',$data,'--GeoIPFile',$geo,'--GeoIPv6File',$geo6,'--ExitNodes','{${{ matrix.exit }}}','--StrictNodes','1','--ClientUseIPv6','0','--Log','notice stdout')
          $p=Start-Process $tor -ArgumentList $args -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError $err
          try {
            for($i=0;$i-lt360;$i++){if($p.HasExited){Get-Content $err -ErrorAction SilentlyContinue;throw 'Tor exited'};if((Test-Path $log)-and(Select-String -LiteralPath $log -SimpleMatch -Pattern 'Bootstrapped 100%' -Quiet)){break};Start-Sleep -Milliseconds 500}
            if(!(Test-Path $log)-or!(Select-String -LiteralPath $log -SimpleMatch -Pattern 'Bootstrapped 100%' -Quiet)){throw 'Tor bootstrap timeout'}
            1..20|ForEach-Object{
              $n=$_;$ok=$false
              1..3|ForEach-Object{if(!$ok){try{$j=& curl.exe -4 -fsS --socks5-hostname '127.0.0.1:${{ matrix.port }}' --connect-timeout 8 --max-time 25 -H 'Accept: application/json' "$env:CHECK_URL?ci=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"|ConvertFrom-Json;if(([string]$j.country).ToUpperInvariant()-eq'${{ matrix.country }}'-and$j.ip){$ok=$true}}catch{};if(!$ok){Start-Sleep -Seconds 1}}}
              if(!$ok){throw "Tor country check $n/20"};Write-Host "TOR_${{ matrix.country }}_PASS $n/20 ip=$($j.ip)"
            }
          } finally {Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Write-Host 'WINDOWS_TOR_${{ matrix.country }}_20_OF_20=PASS'

  windows-engine-20:
    runs-on: windows-latest
    timeout-minutes: 35
    needs: [source-safety, windows-native-20, windows-tor-20]
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: de-fra-01
            country: DE
          - server: us-mia-01
            country: US
    steps:
      - uses: actions/checkout@v4
      - name: Run the actual Windows Full Tunnel and verify twenty direct requests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue'
          $base="$env:RUNNER_TEMP\HighGAS";New-Item -ItemType Directory -Force $base|Out-Null
          Copy-Item local-helper/windows/highgas-tor.ps1 "$base\highgas-tor.ps1"
          Invoke-WebRequest -UseBasicParsing "https://github.com/xjasonlyu/tun2socks/releases/download/v$env:TUN2SOCKS_VERSION/tun2socks-windows-amd64.zip" -OutFile "$base\t2s.zip"
          if((Get-FileHash "$base\t2s.zip" -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:TUN2SOCKS_WIN_SHA256){throw 'tun2socks SHA'}
          Expand-Archive "$base\t2s.zip" "$base\t2s" -Force;$tun=(Get-ChildItem "$base\t2s" -Recurse -File|Where-Object Name -like 'tun2socks*.exe'|Select-Object -First 1).FullName;Copy-Item $tun "$base\tun2socks.exe"
          Invoke-WebRequest -UseBasicParsing "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile "$base\w.zip";Expand-Archive "$base\w.zip" "$base\w" -Force;$dll=(Get-ChildItem "$base\w" -Recurse -File -Filter wintun.dll|Where-Object FullName -match 'amd64'|Select-Object -First 1).FullName;Copy-Item $dll "$base\wintun.dll"
          $torUrl="https://archive.torproject.org/tor-package-archive/torbrowser/$env:TOR_VERSION/tor-expert-bundle-windows-x86_64-$env:TOR_VERSION.tar.gz";Invoke-WebRequest -UseBasicParsing $torUrl -OutFile "$base\tor.tgz";New-Item -ItemType Directory -Force "$base\tor-expert"|Out-Null;tar -xzf "$base\tor.tgz" -C "$base\tor-expert"
          $env:HIGHGAS_BASE=$base
          $fwBefore=@(Get-NetFirewallProfile -Profile Domain,Private,Public|ForEach-Object{"$($_.Name)=$($_.DefaultOutboundAction)"}) -join ';'
          $baseline=(& curl.exe -4 -fsS --connect-timeout 6 --max-time 20 -H 'Accept: application/json' "$env:CHECK_URL?before=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"|ConvertFrom-Json).ip
          if(!$baseline){throw 'baseline IP'}
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$base\highgas-tor.ps1" -Action up -Server '${{ matrix.server }}'
            if($LASTEXITCODE-ne0){throw 'engine up'}
            $v=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$base\highgas-tor.ps1" -Action verify
            $v|ForEach-Object{Write-Host $_};if($v-notcontains'VERIFIED=1'){throw 'product verification != 5/5'}
            1..20|ForEach-Object{
              $n=$_;$ok=$false
              1..3|ForEach-Object{if(!$ok){try{$j=& curl.exe -4 -fsS --connect-timeout 8 --max-time 30 -H 'Accept: application/json' "$env:CHECK_URL?full=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"|ConvertFrom-Json;if(([string]$j.country).ToUpperInvariant()-eq'${{ matrix.country }}'-and$j.ip-and$j.ip-ne$baseline){$ok=$true}}catch{};if(!$ok){Start-Sleep -Seconds 1}}}
              if(!$ok){throw "FULL TUNNEL direct check $n/20"};Write-Host "WINDOWS_FULL_${{ matrix.country }}_PASS $n/20 ip=$($j.ip)"
            }
            $state=Get-Content "$base\runtime\state.json" -Raw|ConvertFrom-Json
            $route=Get-NetRoute -DestinationPrefix '0.0.0.0/0' -InterfaceAlias ([string]$state.tunAlias) -PolicyStore ActiveStore -ErrorAction Stop|Select-Object -First 1
            if(!$route){throw 'Wintun default route missing'}
            & curl.exe -6 -fsS --connect-timeout 2 --max-time 5 https://api64.ipify.org *> $null
            if($LASTEXITCODE-eq0){throw 'IPv6 leak'}
            $udpWorked=$true
            try { Resolve-DnsName -Name example.com -Server 1.1.1.1 -DnsOnly -QuickTimeout -ErrorAction Stop|Out-Null } catch {$udpWorked=$false}
            if($udpWorked){throw 'direct external UDP DNS unexpectedly succeeded'}
            Write-Host 'WINDOWS_KILLSWITCH_IPV6_UDP=PASS'
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$base\highgas-tor.ps1" -Action down -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          $fwAfter=@(Get-NetFirewallProfile -Profile Domain,Private,Public|ForEach-Object{"$($_.Name)=$($_.DefaultOutboundAction)"}) -join ';'
          if($fwAfter-ne$fwBefore){Write-Host "BEFORE=$fwBefore AFTER=$fwAfter";throw 'firewall restore mismatch'}
          $restored=$false;1..5|ForEach-Object{if(!$restored){try{$x=& curl.exe -4 -fsS --connect-timeout 5 --max-time 15 "$env:CHECK_URL?after=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"|ConvertFrom-Json;if($x.ip){$restored=$true}}catch{};if(!$restored){Start-Sleep -Seconds 1}}};if(!$restored){throw 'network not restored'}
          Write-Host 'WINDOWS_PRODUCT_${{ matrix.country }}_FINAL=PASS'

  mac-engine-20:
    runs-on: macos-15-intel
    timeout-minutes: 35
    needs: source-safety
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: de-fra-01
            country: DE
          - server: us-mia-01
            country: US
    steps:
      - uses: actions/checkout@v4
      - name: Run actual macOS Intel Full Tunnel and verify twenty direct requests
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          BASE='/Library/Application Support/HighGAS'
          sudo rm -rf "$BASE"
          sudo mkdir -p "$BASE"
          curl -fL --retry 3 "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_VERSION}/tor-expert-bundle-macos-x86_64-${TOR_VERSION}.tar.gz" -o /tmp/tor.tgz
          mkdir -p /tmp/hg-tor && tar -xzf /tmp/tor.tgz -C /tmp/hg-tor
          curl -fL --retry 3 "https://github.com/xjasonlyu/tun2socks/releases/download/v${TUN2SOCKS_VERSION}/tun2socks-darwin-amd64.zip" -o /tmp/t2s.zip
          echo "${TUN2SOCKS_MAC_SHA256}  /tmp/t2s.zip" | shasum -a 256 -c -
          mkdir -p /tmp/hg-t2s && unzip -q /tmp/t2s.zip -d /tmp/hg-t2s
          TUN="$(find /tmp/hg-t2s -type f -name 'tun2socks*' ! -name '*.zip' ! -name '*LICENSE*' -print -quit)"
          sudo cp -R /tmp/hg-tor "$BASE/tor-expert"
          sudo cp "$TUN" "$BASE/tun2socks"
          sudo cp local-helper/highgas-tor "$BASE/highgas-tor"
          sudo chmod +x "$BASE/highgas-tor" "$BASE/tun2socks" "$BASE/tor-expert/tor/tor"
          BASELINE="$(curl -4 -fsS --connect-timeout 6 --max-time 20 "$CHECK_URL?before=$(date +%s)" | sed -n 's/.*"ip"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          test -n "$BASELINE"
          cleanup(){ sudo "$BASE/highgas-tor" down >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo "$BASE/highgas-tor" up '${{ matrix.server }}'
          VERIFY="$(sudo "$BASE/highgas-tor" verify)"; printf '%s\n' "$VERIFY"; printf '%s\n' "$VERIFY" | grep -q '^VERIFIED=1$'
          for i in $(seq 1 20); do
            OK=0
            for retry in 1 2 3; do
              RAW="$(curl -4 -fsS --connect-timeout 8 --max-time 30 -H 'Accept: application/json' "$CHECK_URL?full=$(date +%s)-$i-$retry" 2>/dev/null || true)"
              IP="$(printf '%s' "$RAW" | sed -n 's/.*"ip"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
              COUNTRY="$(printf '%s' "$RAW" | sed -n 's/.*"country"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | tr '[:lower:]' '[:upper:]')"
              if [[ -n "$IP" && "$IP" != "$BASELINE" && "$COUNTRY" == '${{ matrix.country }}' ]]; then OK=1; break; fi
              sleep 1
            done
            [[ "$OK" -eq 1 ]] || { echo "mac full tunnel check $i failed"; exit 1; }
            echo "MAC_FULL_${{ matrix.country }}_PASS $i/20 ip=$IP"
          done
          if curl -6 -fsS --connect-timeout 2 --max-time 5 https://api64.ipify.org >/dev/null 2>&1; then echo 'IPv6 leak'; exit 1; fi
          sudo "$BASE/highgas-tor" down >/dev/null
          trap - EXIT
          sleep 2
          curl -4 -fsS --connect-timeout 5 --max-time 15 "$CHECK_URL?after=$(date +%s)" >/dev/null
          echo 'MAC_PRODUCT_${{ matrix.country }}_FINAL=PASS'

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [windows-engine-20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: local-helper/go.mod
      - name: Build exact Windows 11 x64 package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue'
          $out="$env:RUNNER_TEMP\HighGAS-Final-Windows11-x64";New-Item -ItemType Directory -Force $out|Out-Null
          Push-Location local-helper;$env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0';go build -trimpath -ldflags='-s -w' -o "$out\highgas-helper.exe" ./windows;Pop-Location
          Copy-Item local-helper/windows/highgas-tor.ps1,local-helper/windows/install.ps1,local-helper/windows/install.bat,local-helper/windows/uninstall.ps1,local-helper/windows/uninstall.bat "$out\"
          Copy-Item public/highgas-local-controller.js "$out\highgas-local-controller.js"
          Copy-Item local-helper/TOR-NOTICE.txt,local-helper/TUN2SOCKS-NOTICE.txt "$out\"
          Invoke-WebRequest -UseBasicParsing "https://github.com/xjasonlyu/tun2socks/releases/download/v$env:TUN2SOCKS_VERSION/tun2socks-windows-amd64.zip" -OutFile "$env:TEMP\t2s-pkg.zip";if((Get-FileHash "$env:TEMP\t2s-pkg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:TUN2SOCKS_WIN_SHA256){throw 't2s sha'};Expand-Archive "$env:TEMP\t2s-pkg.zip" "$env:TEMP\t2s-pkg" -Force;$tun=(Get-ChildItem "$env:TEMP\t2s-pkg" -Recurse -File|Where-Object Name -like 'tun2socks*.exe'|Select-Object -First 1).FullName;Copy-Item $tun "$out\tun2socks.exe"
          Invoke-WebRequest -UseBasicParsing "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile "$env:TEMP\w-pkg.zip";Expand-Archive "$env:TEMP\w-pkg.zip" "$env:TEMP\w-pkg" -Force;$dll=(Get-ChildItem "$env:TEMP\w-pkg" -Recurse -File -Filter wintun.dll|Where-Object FullName -match 'amd64'|Select-Object -First 1).FullName;Copy-Item $dll "$out\wintun.dll"
          Invoke-WebRequest -UseBasicParsing "https://archive.torproject.org/tor-package-archive/torbrowser/$env:TOR_VERSION/tor-expert-bundle-windows-x86_64-$env:TOR_VERSION.tar.gz" -OutFile "$env:TEMP\tor-pkg.tgz";New-Item -ItemType Directory -Force "$out\tor-expert"|Out-Null;tar -xzf "$env:TEMP\tor-pkg.tgz" -C "$out\tor-expert"
          @'
          HighGAS 2.0 FINAL — Windows 11 x64
          1. Execute install.bat e aceite Administrador.
          2. Abra o atalho HighGAS da Área de Trabalho.
          3. Escolha Alemanha ou Estados Unidos e clique LIGAR VPN.
          4. CONECTADO só aparece após IP, país, DNS, IPv6 e Kill Switch passarem.
          5. Para remover, execute uninstall.bat.
          TCP IPv4 + DNS passam pelo Tor. UDP e IPv6 ficam bloqueados enquanto ligado para impedir vazamento direto.
          '@|Set-Content "$out\LEIA-ME.txt" -Encoding UTF8
          Get-FileHash "$out\highgas-helper.exe","$out\tun2socks.exe","$out\wintun.dll","$out\tor-expert\tor\tor.exe" -Algorithm SHA256|ForEach-Object{"$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))"}|Set-Content "$out\SHA256SUMS.txt" -Encoding ASCII
          "PACKAGE=$out"|Out-File $env:GITHUB_ENV -Append
      - name: Install helper and uninstall cleanly
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$out=$env:PACKAGE
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$out\install.ps1"
          $h=$null;1..40|ForEach-Object{if(!$h){try{$h=Invoke-RestMethod -UseBasicParsing http://127.0.0.1:37654/v1/health -TimeoutSec 3}catch{};if(!$h){Start-Sleep -Milliseconds 250}}};if(!$h.helper-or$h.version-ne'2.0.0'-or!$h.engineReady){throw 'helper health'}
          $s=Invoke-WebRequest -UseBasicParsing http://127.0.0.1:37654/api/servers -TimeoutSec 5;if($s.Content-notmatch'de-fra-01'-or$s.Content-notmatch'us-mia-01'){throw 'catalog'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$out\uninstall.ps1"
          Start-Sleep -Seconds 1;if(Test-Path "$env:ProgramData\HighGAS"){throw 'uninstall residue'}
          Write-Host 'WINDOWS_PACKAGE_INSTALL_UNINSTALL=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: HighGAS-Final-Windows11-x64
          path: ${{ env.PACKAGE }}
          retention-days: 30

  package-macos:
    runs-on: macos-15-intel
    timeout-minutes: 25
    needs: [mac-engine-20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: local-helper/go.mod
      - name: Build exact macOS Intel package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/HighGAS-Final-macOS-Intel";mkdir -p "$OUT" /tmp/pkg-tor /tmp/pkg-t2s
          (cd local-helper && CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$OUT/highgas-helper" ./direct)
