name: HighGAS Full Tunnel

on:
  pull_request:
    paths:
      - "local-helper/**"
      - "public/highgas-local-controller.js"
      - ".github/workflows/highgas-local-helper.yml"
  push:
    branches:
      - highgas-full-tunnel-v1
    paths:
      - "local-helper/**"
      - "public/highgas-local-controller.js"
      - ".github/workflows/highgas-local-helper.yml"
  workflow_dispatch:

env:
  TOR_EXPERT_VERSION: "15.0.21"
  TUN2SOCKS_VERSION: "2.7.0"
  TUN2SOCKS_AMD64_SHA256: "6e654da8bab9ca1645862f0e251a69980e0966680713011feea7b1e5901b2a95"
  TUN2SOCKS_ARM64_SHA256: "7c5ebfe2ffb60ecf6e958cc5bbf3e06e74b8b33575ffbb4ba4f6f785a647f1ad"

jobs:
  build-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: local-helper/go.mod

      - name: Validate Go helper
        working-directory: local-helper
        run: |
          go vet ./direct
          go test ./direct

      - name: Validate zsh scripts
        run: |
          command -v zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
          zsh -n local-helper/highgas-tunnel
          zsh -n local-helper/highgas-tor
          zsh -n local-helper/install.command
          zsh -n local-helper/uninstall.command

      - name: Fetch pinned WireGuard Go
        run: git clone --depth 1 --branch 0.0.20250522 https://git.zx2c4.com/wireguard-go /tmp/wireguard-go

      - name: Fetch official Tor Expert Bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tor-expert/intel /tmp/tor-expert/apple-silicon
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_EXPERT_VERSION}/tor-expert-bundle-macos-x86_64-${TOR_EXPERT_VERSION}.tar.gz" \
            -o /tmp/tor-intel.tar.gz
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_EXPERT_VERSION}/tor-expert-bundle-macos-aarch64-${TOR_EXPERT_VERSION}.tar.gz" \
            -o /tmp/tor-apple-silicon.tar.gz
          tar -xzf /tmp/tor-intel.tar.gz -C /tmp/tor-expert/intel
          tar -xzf /tmp/tor-apple-silicon.tar.gz -C /tmp/tor-expert/apple-silicon
          test -x /tmp/tor-expert/intel/tor/tor
          test -f /tmp/tor-expert/intel/data/geoip
          test -f /tmp/tor-expert/intel/data/geoip6
          test -x /tmp/tor-expert/apple-silicon/tor/tor
          test -f /tmp/tor-expert/apple-silicon/data/geoip
          test -f /tmp/tor-expert/apple-silicon/data/geoip6
          file /tmp/tor-expert/intel/tor/tor | grep -Eqi 'x86_64|x86-64'
          file /tmp/tor-expert/apple-silicon/tor/tor | grep -Eqi 'arm64|aarch64'

      - name: Fetch and verify pinned tun2socks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/xjasonlyu/tun2socks/releases/download/v${TUN2SOCKS_VERSION}/tun2socks-darwin-amd64.zip" \
            -o /tmp/tun2socks-amd64.zip
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/xjasonlyu/tun2socks/releases/download/v${TUN2SOCKS_VERSION}/tun2socks-darwin-arm64.zip" \
            -o /tmp/tun2socks-arm64.zip
          echo "${TUN2SOCKS_AMD64_SHA256}  /tmp/tun2socks-amd64.zip" | sha256sum -c -
          echo "${TUN2SOCKS_ARM64_SHA256}  /tmp/tun2socks-arm64.zip" | sha256sum -c -
          mkdir -p /tmp/tun2socks/intel /tmp/tun2socks/apple-silicon
          unzip -q /tmp/tun2socks-amd64.zip -d /tmp/tun2socks/intel
          unzip -q /tmp/tun2socks-arm64.zip -d /tmp/tun2socks/apple-silicon
          echo 'Intel archive:' && find /tmp/tun2socks/intel -maxdepth 2 -type f -print
          echo 'ARM archive:' && find /tmp/tun2socks/apple-silicon -maxdepth 2 -type f -print
          TUN_INTEL="$(find /tmp/tun2socks/intel -type f -name 'tun2socks*' ! -name '*.zip' ! -name '*LICENSE*' -print -quit)"
          TUN_ARM="$(find /tmp/tun2socks/apple-silicon -type f -name 'tun2socks*' ! -name '*.zip' ! -name '*LICENSE*' -print -quit)"
          test -n "$TUN_INTEL" && test -f "$TUN_INTEL"
          test -n "$TUN_ARM" && test -f "$TUN_ARM"
          cp "$TUN_INTEL" /tmp/tun2socks/intel/tun2socks-bin
          cp "$TUN_ARM" /tmp/tun2socks/apple-silicon/tun2socks-bin
          chmod +x /tmp/tun2socks/intel/tun2socks-bin /tmp/tun2socks/apple-silicon/tun2socks-bin
          file /tmp/tun2socks/intel/tun2socks-bin | grep -Eqi 'x86_64|x86-64'
          file /tmp/tun2socks/apple-silicon/tun2socks-bin | grep -Eqi 'arm64|aarch64'

      - name: Build macOS packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-helper/dist/intel local-helper/dist/apple-silicon
          for spec in 'intel amd64' 'apple-silicon arm64'; do
            set -- $spec
            out="$1"
            arch="$2"
            (cd local-helper && CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/$out/highgas-helper" ./direct)
            (cd /tmp/wireguard-go && CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/local-helper/dist/$out/wireguard-go" .)
            cp local-helper/highgas-tunnel local-helper/highgas-tor local-helper/install.command local-helper/uninstall.command local-helper/TOR-NOTICE.txt local-helper/TUN2SOCKS-NOTICE.txt public/highgas-local-controller.js "local-helper/dist/$out/"
            cp "/tmp/tun2socks/$out/tun2socks-bin" "local-helper/dist/$out/tun2socks"
            mkdir -p "local-helper/dist/$out/tor-expert"
            cp -R "/tmp/tor-expert/$out/." "local-helper/dist/$out/tor-expert/"
            chmod +x "local-helper/dist/$out/"{highgas-helper,wireguard-go,tun2socks,highgas-tunnel,highgas-tor,install.command,uninstall.command}
            chmod +x "local-helper/dist/$out/tor-expert/tor/tor"
          done

      - name: Run 48 HighGAS safety tests
        shell: bash
        run: |
          set -euo pipefail
          T=0
          ok(){ T=$((T+1)); echo "PASS $T - $1"; }
          must(){ "$@"; ok "$*"; }
          has(){ grep -Fq -- "$2" "$1"; ok "$2"; }
          lacks(){ ! grep -Fq -- "$2" "$1"; ok "sem $2"; }

          must zsh -n local-helper/highgas-tor
          must zsh -n local-helper/install.command
          must zsh -n local-helper/uninstall.command
          must test -x local-helper/dist/intel/highgas-helper
          must test -x local-helper/dist/intel/tun2socks
          must test -x local-helper/dist/intel/tor-expert/tor/tor
          must test -f local-helper/dist/intel/tor-expert/data/geoip
          must test -f local-helper/dist/intel/tor-expert/data/geoip6
          must test -x local-helper/dist/apple-silicon/highgas-helper
          must test -x local-helper/dist/apple-silicon/tun2socks
          must test -x local-helper/dist/apple-silicon/tor-expert/tor/tor
          must bash -c "file local-helper/dist/intel/highgas-helper | grep -Eqi 'x86_64|x86-64'"
          must bash -c "file local-helper/dist/intel/tun2socks | grep -Eqi 'x86_64|x86-64'"
          must bash -c "file local-helper/dist/apple-silicon/highgas-helper | grep -Eqi 'arm64|aarch64'"
          must bash -c "file local-helper/dist/apple-silicon/tun2socks | grep -Eqi 'arm64|aarch64'"
          has local-helper/highgas-tor '--StrictNodes 1'
          has local-helper/highgas-tor '--DNSPort'
          has local-helper/highgas-tor '--ClientUseIPv6 0'
          has local-helper/highgas-tor '--User "$PFUSER"'
          has local-helper/highgas-tor 'block drop out quick on $dev inet all'
          has local-helper/highgas-tor 'block drop out quick inet6 all'
          has local-helper/highgas-tor 'pass out quick on lo0 all'
          has local-helper/highgas-tor 'route-to ($dev $gw)'
          has local-helper/highgas-tor 'user $PFUSER'
          has local-helper/highgas-tor 'pfctl -F states'
          has local-helper/highgas-tor 'networksetup -setdnsservers "$svc" 127.0.0.1'
          has local-helper/highgas-tor 'VERIFIED=1'
          has local-helper/highgas-tor 'IP_CHANGED='
          has local-helper/highgas-tor 'COUNTRY_OK='
          has local-helper/highgas-tor 'DNS_OK='
          has local-helper/highgas-tor 'IPV6_OK='
          has local-helper/highgas-tor 'ROUTE_OK='
          has local-helper/highgas-tor 'a verificação completa não passou; o HighGAS desligou para evitar vazamento'
          has local-helper/highgas-tor 'connected tor $country $server'
          has local-helper/install.command 'tun2socks'
          has local-helper/install.command 'HighGAS.webloc'
          has local-helper/install.command 'Full Tunnel'
          has local-helper/install.command 'chmod 711 "$SYSTEM"'
          has local-helper/install.command 'plutil -lint "$WEBLOC"'
          has local-helper/uninstall.command 'highgas-tor" down'
          has public/highgas-local-controller.js 'credentials: "same-origin"'
          has public/highgas-local-controller.js 'LOCAL_HOST'
          has public/highgas-local-controller.js 'IP alterado'
          has public/highgas-local-controller.js 'País correto'
          has public/highgas-local-controller.js 'DNS protegido'
          has public/highgas-local-controller.js 'IPv6 sem vazamento'
          has public/highgas-local-controller.js 'Kill Switch'
          lacks local-helper/highgas-tor 'setsocksfirewallproxystate "$svc" on'
          echo "TOTAL_SAFETY_TESTS=$T"
          test "$T" -ge 48

      - uses: actions/upload-artifact@v4
        with:
          name: HighGAS-Full-Tunnel-macOS-Intel
          path: local-helper/dist/intel/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: HighGAS-Full-Tunnel-macOS-Apple-Silicon
          path: local-helper/dist/apple-silicon/
          if-no-files-found: error

  macos-safety:
    runs-on: macos-13
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: macOS native PF, utun and route checks
        shell: bash
        run: |
          set -euo pipefail
          zsh -n local-helper/highgas-tor
          zsh -n local-helper/install.command
          command -v /sbin/pfctl
          command -v /sbin/route
          command -v /sbin/ifconfig
          command -v /usr/sbin/networksetup
          command -v /usr/bin/security
          command -v /bin/launchctl
          id _www
          grep -Eq 'anchor[[:space:]]+"com\.apple/\*"' /etc/pf.conf

          cat >/tmp/highgas-pf-test.conf <<'EOF'
          pass out quick on lo0 all
          pass out quick on en0 route-to (en0 192.0.2.1) inet proto tcp user _www keep state
          block drop out quick on en0 inet all
          block drop out quick inet6 all
          EOF
          sudo /sbin/pfctl -nf /tmp/highgas-pf-test.conf

          curl --fail --location --retry 3 \
            "https://github.com/xjasonlyu/tun2socks/releases/download/v${TUN2SOCKS_VERSION}/tun2socks-darwin-amd64.zip" \
            -o /tmp/tun2socks.zip
          echo "${TUN2SOCKS_AMD64_SHA256}  /tmp/tun2socks.zip" | shasum -a 256 -c -
          mkdir -p /tmp/t2s && unzip -q /tmp/tun2socks.zip -d /tmp/t2s
          find /tmp/t2s -maxdepth 2 -type f -print
          TUN="$(find /tmp/t2s -type f -name 'tun2socks*' ! -name '*.zip' ! -name '*LICENSE*' -print -quit)"
          test -n "$TUN" && test -f "$TUN"
          chmod +x "$TUN"
          file "$TUN" | grep -Eqi 'x86_64|x86-64'

          sudo "$TUN" -device utun230 -proxy socks5://127.0.0.1:9 -loglevel error >/tmp/t2s.log 2>&1 &
          PID=$!
          trap 'sudo kill "$PID" >/dev/null 2>&1 || true; sudo /sbin/route -q -n delete -inet 203.0.113.0/24 -interface utun230 >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            /sbin/ifconfig utun230 >/dev/null 2>&1 && break
            sleep 0.2
          done
          /sbin/ifconfig utun230
          sudo /sbin/ifconfig utun230 inet 198.18.0.1 198.18.0.1 up
          sudo /sbin/route -q -n add -inet 203.0.113.0/24 -interface utun230
          /sbin/route -n get 203.0.113.1 | grep -q 'interface: utun230'
          sudo /sbin/route -q -n delete -inet 203.0.113.0/24 -interface utun230
          sudo kill "$PID" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT
          echo "macOS native PF + utun + route runtime checks: OK"
