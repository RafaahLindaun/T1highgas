name: HighGAS One Shot Dynamic utun Fix

on:
  push:
    branches: [highgas-full-tunnel-v1]
    paths: [".github/workflows/highgas-one-shot-utun-fix.yml"]

permissions:
  contents: write

jobs:
  patch-dynamic-utun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highgas-full-tunnel-v1
      - name: Patch production engine to use macOS allocated utun
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('local-helper/highgas-tor')
          s = p.read_text()
          original = s

          s = s.replace(
              'TUNLOG="$RUNTIME/tun2socks.log"\nPFTOKEN=',
              'TUNLOG="$RUNTIME/tun2socks.log"\nTUNNAME="$RUNTIME/tun.name"\nPFTOKEN=',
              1,
          )

          s = s.replace(
              '  /bin/rm -f "$STATE" >/dev/null 2>&1 || true\n',
              '  /bin/rm -f "$TUNNAME" "$STATE" >/dev/null 2>&1 || true\n',
              1,
          )

          old_choose = '''  iface="$(choose_utun)" || { print -u2 "não encontrei uma interface de túnel livre"; down >/dev/null 2>&1 || true; return 8; }\n\n'''
          if old_choose not in s:
              raise SystemExit('manual choose_utun call not found')
          s = s.replace(old_choose, '', 1)

          old_state = '    print -r -- "TOR_PROBE_IP=${torprobe%%|*}"\n    print -r -- "IFACE=$iface"\n    print -r -- "STARTED_AT=$(/bin/date +%s)"\n'
          new_state = '    print -r -- "TOR_PROBE_IP=${torprobe%%|*}"\n    print -r -- "STARTED_AT=$(/bin/date +%s)"\n'
          if old_state not in s:
              raise SystemExit('initial IFACE state write not found')
          s = s.replace(old_state, new_state, 1)

          old_launch = '''  "$TUN2SOCKS" -device "$iface" -proxy "socks5://127.0.0.1:$SOCKS_PORT" >"$TUNLOG" 2>&1 &\n  tunpid=$!\n  print -r -- "$tunpid" > "$TUNPID"\n  for _ in {1..100}; do\n    /sbin/ifconfig "$iface" >/dev/null 2>&1 && break\n    /bin/kill -0 "$tunpid" >/dev/null 2>&1 || { print -u2 "o motor Full Tunnel encerrou ao iniciar"; down >/dev/null 2>&1 || true; return 10; }\n    /bin/sleep 0.1\n  done\n  /sbin/ifconfig "$iface" >/dev/null 2>&1 || { print -u2 "a interface Full Tunnel não foi criada"; down >/dev/null 2>&1 || true; return 10; }\n\n'''
          new_launch = '''  /bin/rm -f "$TUNNAME" >/dev/null 2>&1 || true\n  /usr/bin/env WG_TUN_NAME_FILE="$TUNNAME" "$TUN2SOCKS" --device utun --proxy "socks5://127.0.0.1:$SOCKS_PORT" >"$TUNLOG" 2>&1 &\n  tunpid=$!\n  print -r -- "$tunpid" > "$TUNPID"\n  for _ in {1..100}; do\n    [[ -s "$TUNNAME" ]] && break\n    /bin/kill -0 "$tunpid" >/dev/null 2>&1 || { print -u2 "o motor Full Tunnel encerrou ao iniciar"; [[ -s "$TUNLOG" ]] && /bin/cat "$TUNLOG" >&2; down >/dev/null 2>&1 || true; return 10; }\n    /bin/sleep 0.1\n  done\n  [[ -s "$TUNNAME" ]] || { print -u2 "o macOS não informou a interface Full Tunnel"; [[ -s "$TUNLOG" ]] && /bin/cat "$TUNLOG" >&2; down >/dev/null 2>&1 || true; return 10; }\n  iface="$(/bin/cat "$TUNNAME" 2>/dev/null | /usr/bin/tr -d '\\r\\n')"\n  [[ "$iface" =~ ^utun[0-9]+$ ]] || { print -u2 "nome de interface Full Tunnel inválido: $iface"; down >/dev/null 2>&1 || true; return 10; }\n  /sbin/ifconfig "$iface" >/dev/null 2>&1 || { print -u2 "a interface Full Tunnel não foi criada"; down >/dev/null 2>&1 || true; return 10; }\n  print -r -- "IFACE=$iface" >> "$STATE"\n\n'''
          if old_launch not in s:
              raise SystemExit('named-utun launch block not found')
          s = s.replace(old_launch, new_launch, 1)

          if s == original:
              raise SystemExit('no product changes made')
          required = [
              'WG_TUN_NAME_FILE="$TUNNAME"',
              '"$TUN2SOCKS" --device utun',
              'print -r -- "IFACE=$iface" >> "$STATE"',
              'TUNNAME="$RUNTIME/tun.name"',
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'missing expected dynamic-utun code: {needle}')
          if 'iface="$(choose_utun)"' in s:
              raise SystemExit('manual utun selection still used')
          p.write_text(s)
          PY
          git diff --check
          grep -Fq 'WG_TUN_NAME_FILE="$TUNNAME"' local-helper/highgas-tor
          grep -Fq '"$TUN2SOCKS" --device utun' local-helper/highgas-tor
          grep -Fq 'IFACE=$iface" >> "$STATE"' local-helper/highgas-tor
          git config user.name 'HighGAS CI'
          git config user.email '89591381+RafaahLindaun@users.noreply.github.com'
          git add local-helper/highgas-tor
          git commit -m 'HighGAS: deixar macOS alocar utun dinamicamente'
          git push origin HEAD:highgas-full-tunnel-v1
