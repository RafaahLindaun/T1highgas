name: HighGAS macOS Runtime

on:
  push:
    branches: [highgas-full-tunnel-v1]
    paths: ["local-helper/**", ".github/workflows/highgas-macos-runtime.yml"]
  workflow_dispatch:

env:
  TOR_EXPERT_VERSION: "15.0.21"
  TUN2SOCKS_VERSION: "2.7.0"
  TUN2SOCKS_AMD64_SHA256: "6e654da8bab9ca1645862f0e251a69980e0966680713011feea7b1e5901b2a95"

jobs:
  platform-intel:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run 32 native Intel macOS checks
        shell: bash
        run: |
          set -euo pipefail
          C=0; pass(){ C=$((C+1)); echo "MAC_PASS $C - $1"; }
          test "$(uname -m)" = x86_64 && pass intel-runner
          test "$(sysctl -n hw.optional.x86_64 2>/dev/null || echo 0)" = 1 && pass x86-capability
          for p in /sbin/pfctl /sbin/route /sbin/ifconfig /usr/sbin/networksetup /usr/bin/security /bin/launchctl /usr/bin/dig /usr/sbin/lsof; do command -v "$p" >/dev/null; pass "tool-$p"; done
          zsh -n local-helper/highgas-tor && pass tor-script-syntax
          zsh -n local-helper/install.command && pass installer-syntax
          zsh -n local-helper/uninstall.command && pass uninstaller-syntax
          id _www >/dev/null && pass isolated-user
          grep -Eq 'anchor[[:space:]]+"com\.apple/\*"' /etc/pf.conf && pass apple-anchor
          RI="$(/sbin/route -n get default)"; GW="$(printf '%s\n' "$RI" | awk '/gateway:/{print $2;exit}')"; DEV="$(printf '%s\n' "$RI" | awk '/interface:/{print $2;exit}')"
          test -n "$GW" && pass default-gateway; test -n "$DEV" && pass default-device; /sbin/ifconfig "$DEV" >/dev/null && pass physical-interface
          SVC="$(/usr/sbin/networksetup -listnetworkserviceorder | awk -v d="$DEV" '/^\([0-9]+\) /{s=$0;sub(/^\([0-9]+\) /,"",s)} index($0,"Device: "d){sub(/^\*/,"",s);print s;exit}')"; test -n "$SVC" && pass active-network-service
          curl -4 -fsS --interface "$DEV" --connect-timeout 5 --max-time 15 https://lowgas.vercel.app/api/network-info | grep -q '"ip"' && pass direct-ip-baseline
          /sbin/route -n get 1.1.1.1 | grep -q "interface: $DEV" && pass direct-route-baseline
          cat >/tmp/hg-pf.conf <<EOF
          pass out quick on lo0 all
          pass out quick on $DEV route-to ($DEV $GW) inet proto tcp user _www keep state
          block drop out quick on $DEV inet all
          block drop out quick inet6 all
          EOF
          sudo /sbin/pfctl -nf /tmp/hg-pf.conf && pass pf-syntax
          curl -fL --retry 3 "https://github.com/xjasonlyu/tun2socks/releases/download/v${TUN2SOCKS_VERSION}/tun2socks-darwin-amd64.zip" -o /tmp/t2s.zip
          echo "${TUN2SOCKS_AMD64_SHA256}  /tmp/t2s.zip" | shasum -a 256 -c - && pass tun2socks-sha
          rm -rf /tmp/t2s && mkdir /tmp/t2s && unzip -q /tmp/t2s.zip -d /tmp/t2s
          TUN="$(find /tmp/t2s -type f -name 'tun2socks*' ! -name '*.zip' ! -name '*LICENSE*' -print -quit)"; chmod +x "$TUN"; file "$TUN" | grep -Eqi 'x86_64|x86-64' && pass tun2socks-intel
          NAME=/tmp/hg-utun; rm -f "$NAME"
          sudo /usr/bin/env WG_TUN_NAME_FILE="$NAME" "$TUN" --device utun --proxy socks5://127.0.0.1:9 --loglevel error >/tmp/t2s.log 2>&1 & TPID=$!
          trap 'sudo kill "$TPID" >/dev/null 2>&1 || true; [[ -n "${UTUN:-}" ]] && sudo /sbin/route -q -n delete -inet 203.0.113.0/24 -interface "$UTUN" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 50); do test -s "$NAME" && break; sudo kill -0 "$TPID" 2>/dev/null || { cat /tmp/t2s.log; exit 1; }; sleep .2; done
          test -s "$NAME" && pass utun-name-file; UTUN="$(sudo cat "$NAME" | tr -d '\r\n')"; [[ "$UTUN" =~ ^utun[0-9]+$ ]] && pass utun-name-valid
          sudo kill -0 "$TPID" 2>/dev/null && pass tun2socks-live; /sbin/ifconfig "$UTUN" >/dev/null && pass utun-created
          sudo /sbin/ifconfig "$UTUN" inet 198.18.0.1 198.18.0.1 up; /sbin/ifconfig "$UTUN" | grep -q 198.18.0.1 && pass utun-address
          sudo /sbin/route -q -n add -inet 203.0.113.0/24 -interface "$UTUN"; /sbin/route -n get 203.0.113.1 | grep -q "interface: $UTUN" && pass route-through-utun
          sudo /sbin/route -q -n delete -inet 203.0.113.0/24 -interface "$UTUN"; /sbin/route -n get 203.0.113.1 2>/dev/null | grep -vq "interface: $UTUN" && pass route-restored
          sudo kill "$TPID" 2>/dev/null || true; wait "$TPID" 2>/dev/null || true
          for i in $(seq 1 30); do /sbin/ifconfig "$UTUN" >/dev/null 2>&1 || break; sleep .1; done; ! /sbin/ifconfig "$UTUN" >/dev/null 2>&1 && pass utun-closed
          trap - EXIT
          echo "PLATFORM_RUNTIME_TESTS=$C"; test "$C" -ge 32

  country-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: de
            expected: DE
            socks: 39150
          - cc: us
            expected: US
            socks: 39151
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Run 22 real Tor + TUN checks
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          EXPECTED: ${{ matrix.expected }}
          SOCKS: ${{ matrix.socks }}
        run: |
          set -euo pipefail
          C=0; pass(){ C=$((C+1)); echo "COUNTRY_PASS $C - $1"; }
          test "$(uname -m)" = x86_64 && pass intel-runner
          id _www >/dev/null && pass isolated-user
          curl -fL --retry 3 "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_EXPERT_VERSION}/tor-expert-bundle-macos-x86_64-${TOR_EXPERT_VERSION}.tar.gz" -o /tmp/tor.tgz
          rm -rf /tmp/hg && mkdir -p /tmp/hg/bundle /tmp/hg/data /tmp/t2s
          tar -xzf /tmp/tor.tgz -C /tmp/hg/bundle; chmod -R a+rX /tmp/hg/bundle
          TOR=/tmp/hg/bundle/tor/tor; GEO=/tmp/hg/bundle/data/geoip; GEO6=/tmp/hg/bundle/data/geoip6
          test -x "$TOR" && pass tor-binary; file "$TOR" | grep -Eqi 'x86_64|x86-64' && pass tor-intel
          sudo -u _www test -r "$GEO" && pass geoip-readable; sudo -u _www test -r "$GEO6" && pass geoip6-readable
          sudo chown _www /tmp/hg/data
          set +e
          sudo "$TOR" --User _www --ClientOnly 1 --RunAsDaemon 1 --AvoidDiskWrites 1 --ClientUseIPv6 0 --SocksPort "127.0.0.1:$SOCKS" --DNSPort 127.0.0.1:53 --DataDirectory /tmp/hg/data --GeoIPFile "$GEO" --GeoIPv6File "$GEO6" --ExitNodes "{$CC}" --StrictNodes 1 --PidFile /tmp/hg/data/tor.pid --Log 'notice file /tmp/hg/data/tor.log' >/tmp/tor-start.log 2>&1
          RC=$?; set -e; test "$RC" -eq 0 || { cat /tmp/tor-start.log; exit 1; }; pass tor-start
          for i in $(seq 1 150); do sudo grep -q 'Bootstrapped 100%' /tmp/hg/data/tor.log 2>/dev/null && break; sleep 1; done
          sudo grep -q 'Bootstrapped 100%' /tmp/hg/data/tor.log || { sudo tail -100 /tmp/hg/data/tor.log; exit 1; }; pass bootstrap-100
          P="$(sudo cat /tmp/hg/data/tor.pid)"; sudo kill -0 "$P" && pass tor-live
          sudo lsof -nP -a -p "$P" -iTCP:"$SOCKS" -sTCP:LISTEN >/dev/null && pass socks-listener
          sudo lsof -nP -a -p "$P" -iUDP:53 >/dev/null && pass dns53-listener
          TARGET="$(/usr/bin/dig +time=3 +tries=1 +short @127.0.0.1 -p 53 lowgas.vercel.app A | grep -E '^[0-9]+(\.[0-9]+){3}$' | head -1)"; test -n "$TARGET" && pass dns-query
          RAW="$(curl -4 -fsS --socks5-hostname "127.0.0.1:$SOCKS" --connect-timeout 10 --max-time 30 https://lowgas.vercel.app/api/network-info)"
          IP="$(printf '%s' "$RAW" | sed -n 's/.*"ip"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"; CT="$(printf '%s' "$RAW" | sed -n 's/.*"country"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | tr '[:lower:]' '[:upper:]')"
          test -n "$IP" && pass tor-egress-ip; test "$CT" = "$EXPECTED" && pass tor-country
          curl -fL --retry 3 "https://github.com/xjasonlyu/tun2socks/releases/download/v${TUN2SOCKS_VERSION}/tun2socks-darwin-amd64.zip" -o /tmp/t2s.zip
          echo "${TUN2SOCKS_AMD64_SHA256}  /tmp/t2s.zip" | shasum -a 256 -c - && pass tun2socks-sha
          unzip -q /tmp/t2s.zip -d /tmp/t2s; TUN="$(find /tmp/t2s -type f -name 'tun2socks*' ! -name '*.zip' ! -name '*LICENSE*' -print -quit)"; chmod +x "$TUN"; file "$TUN" | grep -Eqi 'x86_64|x86-64' && pass tun2socks-intel
          NAME=/tmp/hg-utun; rm -f "$NAME"
          sudo /usr/bin/env WG_TUN_NAME_FILE="$NAME" "$TUN" --device utun --proxy "socks5://127.0.0.1:$SOCKS" --loglevel error >/tmp/t2s.log 2>&1 & TP=$!
          for i in $(seq 1 50); do test -s "$NAME" && break; sudo kill -0 "$TP" 2>/dev/null || { cat /tmp/t2s.log; exit 1; }; sleep .2; done
          test -s "$NAME" && pass utun-name-file; U="$(sudo cat "$NAME" | tr -d '\r\n')"; [[ "$U" =~ ^utun[0-9]+$ ]] && pass utun-name-valid
          sudo kill -0 "$TP" && pass tun2socks-live; /sbin/ifconfig "$U" >/dev/null && pass utun-live
          sudo /sbin/ifconfig "$U" inet 198.18.0.1 198.18.0.1 up; /sbin/ifconfig "$U" | grep -q 198.18.0.1 && pass utun-address
          sudo /sbin/route -q -n add -host "$TARGET" -interface "$U"; /sbin/route -n get "$TARGET" | grep -q "interface: $U" && pass target-route-through-tun
          RAW="$(curl -4 -fsS --resolve "lowgas.vercel.app:443:$TARGET" --connect-timeout 10 --max-time 35 https://lowgas.vercel.app/api/network-info)"
          CT="$(printf '%s' "$RAW" | sed -n 's/.*"country"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | tr '[:lower:]' '[:upper:]')"; test "$CT" = "$EXPECTED" && pass tun-to-tor-country
          sudo /sbin/route -q -n delete -host "$TARGET" -interface "$U" >/dev/null 2>&1 || true; sudo kill "$TP" >/dev/null 2>&1 || true; wait "$TP" 2>/dev/null || true; sudo kill "$P" >/dev/null 2>&1 || true
          for i in $(seq 1 30); do sudo lsof -nP -iUDP:53 >/dev/null 2>&1 || break; sleep .1; done; ! sudo lsof -nP -iUDP:53 >/dev/null 2>&1 && pass dns53-released
          ! /sbin/ifconfig "$U" >/dev/null 2>&1 && pass utun-closed
          echo "COUNTRY_RUNTIME_TESTS=$C"; test "$C" -ge 22
