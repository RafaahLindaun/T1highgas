name: HighGAS One Shot PF utun Fix

on:
  push:
    branches: [highgas-full-tunnel-v1]
    paths: [".github/workflows/highgas-one-shot-pf-utun-fix.yml"]

permissions:
  contents: write

jobs:
  patch-pf-utun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highgas-full-tunnel-v1
      - name: Route Tor itself around the TUN without leaking app traffic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('local-helper/highgas-tor')
          s = p.read_text()
          original = s

          old_head = '''pf_enable_and_load() {\n  local dev="$1" gw="$2" pfstate rules token=""\n  rules="$(/usr/bin/mktemp -t highgas-pf).conf"\n  cat > "$rules" <<EOF_PF\npass out quick on lo0 all\npass out quick route-to ($dev $gw) inet proto tcp user $PFUSER keep state\nblock drop out quick on $dev inet all\nblock drop out quick inet6 all\nEOF_PF\n'''
          new_head = '''pf_enable_and_load() {\n  local dev="$1" gw="$2" iface="$3" pfstate rules token=""\n  rules="$(/usr/bin/mktemp -t highgas-pf).conf"\n  cat > "$rules" <<EOF_PF\npass out quick on lo0 all\npass out quick on $dev inet proto tcp user $PFUSER keep state\npass out quick on $iface route-to ($dev $gw) inet proto tcp user $PFUSER keep state\nblock drop out quick on $dev inet all\nblock drop out quick inet6 all\nEOF_PF\n'''
          if old_head not in s:
              raise SystemExit('current PF function block not found')
          s = s.replace(old_head, new_head, 1)

          old_early = '''  # Fail-closed: o kill switch entra antes do túnel assumir o tráfego.\n  pf_enable_and_load "$dev" "$gw" || { down >/dev/null 2>&1 || true; return 9; }\n\n'''
          if old_early not in s:
              raise SystemExit('early PF activation block not found')
          s = s.replace(old_early, '', 1)

          old_after = '''  /sbin/ifconfig "$iface" >/dev/null 2>&1 || { print -u2 "a interface Full Tunnel não foi criada"; down >/dev/null 2>&1 || true; return 10; }\n  print -r -- "IFACE=$iface" >> "$STATE"\n\n  /sbin/ifconfig "$iface" inet "$TUN_ADDR" "$TUN_ADDR" up >/dev/null\n  local r\n'''
          new_after = '''  /sbin/ifconfig "$iface" >/dev/null 2>&1 || { print -u2 "a interface Full Tunnel não foi criada"; down >/dev/null 2>&1 || true; return 10; }\n  print -r -- "IFACE=$iface" >> "$STATE"\n  /sbin/ifconfig "$iface" inet "$TUN_ADDR" "$TUN_ADDR" up >/dev/null\n\n  # Fail-closed: agora que o utun real existe, o PF consegue mandar somente o\n  # processo Tor de volta à interface física. O tráfego dos apps permanece\n  # bloqueado na interface física e, em seguida, passa a entrar pelo utun.\n  pf_enable_and_load "$dev" "$gw" "$iface" || { down >/dev/null 2>&1 || true; return 9; }\n\n  local r\n'''
          if old_after not in s:
              raise SystemExit('dynamic utun post-start block not found')
          s = s.replace(old_after, new_after, 1)

          required = [
              'local dev="$1" gw="$2" iface="$3" pfstate rules token=""',
              'pass out quick on $dev inet proto tcp user $PFUSER keep state',
              'pass out quick on $iface route-to ($dev $gw) inet proto tcp user $PFUSER keep state',
              'pf_enable_and_load "$dev" "$gw" "$iface"',
          ]
          for x in required:
              if x not in s:
                  raise SystemExit('missing: '+x)
          if 'pf_enable_and_load "$dev" "$gw" ||' in s:
              raise SystemExit('old PF call remains')
          if s == original:
              raise SystemExit('no changes made')
          p.write_text(s)
          PY
          git diff --check
          grep -Fq 'pass out quick on $iface route-to ($dev $gw)' local-helper/highgas-tor
          grep -Fq 'pf_enable_and_load "$dev" "$gw" "$iface"' local-helper/highgas-tor
          git config user.name 'HighGAS CI'
          git config user.email '89591381+RafaahLindaun@users.noreply.github.com'
          git add local-helper/highgas-tor
          git commit -m 'HighGAS: desviar somente Tor do utun pelo PF'
          git push origin HEAD:highgas-full-tunnel-v1
