name: HighGAS Fix Windows Tor
on:
  push:
    branches: [highgas-windows11-universal-v2]
    paths: ['.github/workflows/highgas-fix-windows-tor.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highgas-windows11-universal-v2
      - name: Apply verified Windows URL interpolation fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('local-helper/windows/highgas-tor.ps1')
          s = p.read_text(encoding='utf-8')
          pairs = [
            ('"$CheckUrl?ts=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"', '"${CheckUrl}?ts=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"'),
            ('"$CheckUrl?tor=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"', '"${CheckUrl}?tor=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"'),
          ]
          for old,new in pairs:
              if old not in s:
                  raise SystemExit(f'pattern not found: {old}')
              s = s.replace(old,new)
          p.write_text(s, encoding='utf-8')
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HighGAS CI'
          git config user.email '89591381+RafaahLindaun@users.noreply.github.com'
          git add local-helper/windows/highgas-tor.ps1
          git diff --cached --check
          git commit -m 'fix: corrigir interpolacao das URLs no engine Windows'
          git push origin HEAD:highgas-windows11-universal-v2
