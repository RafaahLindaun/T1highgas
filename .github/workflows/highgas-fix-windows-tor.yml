name: HighGAS Fix Windows Tor
on:
  push:
    branches: [highgas-windows11-universal-v2]
    paths: ['.github/workflows/highgas-fix-windows-tor.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highgas-windows11-universal-v2
      - name: Apply verified Windows Tor quoting fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('local-helper/windows/highgas-tor.ps1')
          s = p.read_text(encoding='utf-8')
          old = "'--Log','notice stdout'"
          new = "'--Log','\"notice stdout\"'"
          if old not in s:
              raise SystemExit('product Tor log pattern not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          w = Path('.github/workflows/highgas-universal-final.yml')
          s = w.read_text(encoding='utf-8')
          if old not in s:
              raise SystemExit('workflow Tor log pattern not found')
          s = s.replace(old, new)
          s = s.replace("lacks \"$W\" \"'--interface',[string]$Physical.Alias\"", "lacks \"$W\" \"'--interface',[string]\"")
          s = s.replace("if($p.HasExited){Get-Content $err -ErrorAction SilentlyContinue;throw 'Tor exited'}", "if($p.HasExited){Write-Host 'TOR_STDOUT';Get-Content $log -ErrorAction SilentlyContinue;Write-Host 'TOR_STDERR';Get-Content $err -ErrorAction SilentlyContinue;throw 'Tor exited'}")
          w.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HighGAS CI'
          git config user.email '89591381+RafaahLindaun@users.noreply.github.com'
          git add local-helper/windows/highgas-tor.ps1 .github/workflows/highgas-universal-final.yml
          git diff --cached --check
          git commit -m 'fix: corrigir argumentos Tor e gate final Windows'
          git push origin HEAD:highgas-windows11-universal-v2
