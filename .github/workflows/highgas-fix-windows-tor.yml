name: HighGAS Fix Windows Tor
on:
  push:
    branches: [highgas-windows11-universal-v2]
    paths: ['.github/workflows/highgas-fix-windows-tor.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highgas-windows11-universal-v2
      - name: Apply verified Windows Tor quoting fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('local-helper/windows/highgas-tor.ps1')
          s = p.read_text(encoding='utf-8')
          old = "'--Log','notice stdout'"
          new = "'--Log','\"notice stdout\"'"
          if old not in s:
              raise SystemExit('product Tor log pattern not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HighGAS CI'
          git config user.email '89591381+RafaahLindaun@users.noreply.github.com'
          git add local-helper/windows/highgas-tor.ps1
          git diff --cached --check
          git commit -m 'fix: corrigir argumentos Tor no engine Windows'
          git push origin HEAD:highgas-windows11-universal-v2
