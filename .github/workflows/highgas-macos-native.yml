name: HighGAS Native macOS

on:
  pull_request:
    paths:
      - "native/macos/**"
      - "public/highgas-native-bridge.js"
      - "index.html"
      - ".github/workflows/highgas-macos-native.yml"
  push:
    branches:
      - highgas-native-macos
    paths:
      - "native/macos/**"
      - "public/highgas-native-bridge.js"
      - "index.html"
      - ".github/workflows/highgas-macos-native.yml"
  workflow_dispatch:

jobs:
  build-native:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Set up compatible Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.17.13'
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: native/macos
        run: |
          go version
          zsh bootstrap.sh

      - name: Resolve Swift packages
        working-directory: native/macos
        run: |
          xcodebuild \
            -project HighGAS.xcodeproj \
            -scheme HighGAS \
            -resolvePackageDependencies

      - name: Compile HighGAS without signing
        working-directory: native/macos
        run: |
          set -o pipefail
          xcodebuild \
            -project HighGAS.xcodeproj \
            -scheme HighGAS \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee highgas-xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: highgas-xcodebuild-log
          path: native/macos/highgas-xcodebuild.log
          if-no-files-found: ignore
