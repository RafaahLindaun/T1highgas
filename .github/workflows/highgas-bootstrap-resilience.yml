name: HighGAS Bootstrap Resilience

on:
  push:
    branches: [highgas-full-tunnel-v1]
    paths:
      - '.github/workflows/highgas-bootstrap-resilience.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highgas-full-tunnel-v1
      - name: Preserve Tor cache and widen first-connect timeout
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          python3 - <<'PY'
          from pathlib import Path

          p = Path('local-helper/highgas-tor')
          s = p.read_text()
          old = '  /bin/rm -rf "$DATADIR"\n  /bin/mkdir -p "$DATADIR"'
          new = '''  # Mantém consensus/microdescriptors entre sessões. Isso reduz muito o
          # tempo de reconexão e evita baixar todo o diretório Tor a cada clique.
          /bin/mkdir -p "$DATADIR"'''
          if old not in s:
              raise SystemExit('datadir reset block not found')
          s = s.replace(old, new, 1)
          s = s.replace('    --AvoidDiskWrites 1 \\\n', '', 1)
          if 'for _ in {1..150}; do' not in s:
              raise SystemExit('bootstrap loop not found')
          s = s.replace('for _ in {1..150}; do', 'for _ in {1..300}; do', 1)
          p.write_text(s)

          p = Path('local-helper/direct/main.go')
          s = p.read_text()
          if 'WriteTimeout:      260 * time.Second,' not in s or '240*time.Second' not in s:
              raise SystemExit('helper timeout markers not found')
          s = s.replace('WriteTimeout:      260 * time.Second,', 'WriteTimeout:      450 * time.Second,', 1)
          s = s.replace('context.WithTimeout(context.Background(), 240*time.Second)', 'context.WithTimeout(context.Background(), 420*time.Second)', 1)
          p.write_text(s)

          p = Path('public/highgas-local-controller.js')
          s = p.read_text()
          if 'timeoutMs: 250000' not in s:
              raise SystemExit('controller timeout marker not found')
          s = s.replace('timeoutMs: 250000', 'timeoutMs: 460000', 1)
          p.write_text(s)
          PY
          zsh -n local-helper/highgas-tor
          grep -Fq 'for _ in {1..300}; do' local-helper/highgas-tor
          grep -Fq 'Mantém consensus/microdescriptors' local-helper/highgas-tor
          ! grep -Fq 'rm -rf "$DATADIR"' local-helper/highgas-tor
          ! grep -Fq -- '--AvoidDiskWrites 1' local-helper/highgas-tor
          grep -Fq '420*time.Second' local-helper/direct/main.go
          grep -Fq 'timeoutMs: 460000' public/highgas-local-controller.js
          git diff --check
          git config user.name 'HighGAS CI'
          git config user.email '89591381+RafaahLindaun@users.noreply.github.com'
          git add local-helper/highgas-tor local-helper/direct/main.go public/highgas-local-controller.js
          git commit -m 'HighGAS: preservar cache Tor e tolerar primeiro bootstrap lento'
          git push origin HEAD:highgas-full-tunnel-v1
